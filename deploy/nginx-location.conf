# Paste inside the existing HTTPS server{} for gloriouscarnivorousplants.top.
# Replace that site's existing location /; do not create a second location /.
# Preserve BaoTa-managed certificates, ACME and HTTP-to-HTTPS redirects.
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
    client_max_body_size 10m;
    proxy_cache off;
}
