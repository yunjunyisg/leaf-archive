<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的 · 植藏</title><link rel="icon" href="/icons/icon-192.png"><meta name="theme-color" content="#244b39"><style>
*{box-sizing:border-box}body{margin:0;background:#f8f9f5;color:#244b39;font:16px system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:900px;margin:auto;padding:26px 20px 48px}a{color:inherit;text-decoration:none}button,input{font:inherit;border-radius:9px;border:1px solid #d0dacb;padding:12px;min-height:44px}button{cursor:pointer;background:#fff;color:inherit}button:disabled{opacity:.5}.brand{display:inline-flex;align-items:center;font-size:25px;font-weight:650;gap:10px}.brand span{background:#244b39;color:#dce8b9;border-radius:10px;padding:4px 10px}nav{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:30px}.note{color:#74806e;font-size:14px;line-height:1.8}section{background:#fff;border:1px solid #e0e6db;border-radius:16px;padding:24px;margin:20px 0}summary{min-height:44px;cursor:pointer;line-height:2.8}h2{font-size:20px;margin-top:0}.identity>div:last-child{min-width:0;flex:1;overflow-wrap:anywhere}.identity .avatar{flex:0 0 86px}.identity{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.avatar{position:relative;width:86px;height:86px;border-radius:50%;background:#e5eedc;display:grid;place-items:center;font-size:34px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.avatar [hidden]{display:none}label{display:block;font-size:14px;color:#687960;margin-top:20px}input{display:block;width:100%;background:#fbfcf9;margin:8px 0 18px}.primary{background:#244b39;color:#fff;border-color:#244b39}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:18px;background:#eff4e9;border-radius:12px;min-width:0}.card small{display:block;color:#718067}.card strong{display:block;font-size:24px;margin-top:9px;overflow-wrap:anywhere}.classification{overflow-wrap:anywhere;list-style:none;padding:0}.classification li{padding:12px 0;border-bottom:1px solid #edf0e9}.classification small{display:block;color:#75836c;margin-top:6px;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions a{display:inline-flex;align-items:center;min-height:44px}.danger{color:#a14030;border-color:#d9b7af}.exit{width:100%;margin-top:12px}#message{line-height:1.8;white-space:pre-line;color:#994132}[hidden]{display:none!important}@media(max-width:600px){main{padding:20px 16px}section{padding:20px}.cards{grid-template-columns:1fr 1fr}.card:first-child{grid-column:1/-1}.card strong{font-size:23px}.identity{gap:16px}nav{font-size:14px}}
</style></head><body><main><nav><a class="brand" href="/account" data-leaf-refresh><span>✳</span>植藏</a><a id="returnLink" href="/">植物收藏</a></nav><h1>我的</h1><p class="note">管理个人资料，看看自己的植物收藏。</p><p id="message" role="status"></p>
<section><div class="identity"><div class="avatar"><span id="avatarInitial">植</span><img id="avatarImage" alt="我的头像" hidden></div><div><strong id="displayName">正在读取…</strong><p class="note" id="loginAccount"></p><div class="actions"><button id="chooseAvatar">设置头像</button><button id="clearAvatar">恢复默认头像</button></div></div></div><input id="avatarFile" type="file" accept="image/*" hidden><form id="profileForm"><label for="nameInput">用户名（显示名称）</label><input id="nameInput" name="displayName" maxlength="50" required autocomplete="nickname"><button class="primary" id="saveProfile">保存资料</button></form></section>
<section id="collectionSummary" hidden><h2>我的收藏概况</h2><div class="cards"><div class="card"><small>购入总额</small><strong id="purchaseTotal">—</strong></div><div class="card"><small>收藏植物</small><strong id="plantCount">—</strong></div><div class="card"><small>植物分类</small><strong id="familyCount">—</strong></div></div><p class="note" id="priceNote"></p></section>
<section id="classificationSection" hidden><div class="actions"><h2>植物分类</h2><a href="/classification">查看分类树 ›</a></div><details><summary>查看科与属的收藏分布</summary><ul class="classification" id="classificationList"></ul></details></section>
<section><h2>账号与应用</h2><p class="note">退出账号会结束当前登录；退出应用仅关闭软件。</p><button class="exit" id="logout">退出账号</button><button class="exit" id="quitApp" hidden>退出应用</button><p class="note" id="browserExitNote">浏览器中可直接关闭当前页面。</p><p class="note"><a class="danger" id="deleteAccount" href="/account/delete" hidden>注销账号并删除数据</a></p></section></main><script src="/profile-client.js" defer></script><script src="/account-ui.js" defer></script></body></html>
